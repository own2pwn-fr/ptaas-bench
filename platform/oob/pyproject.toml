[project]
name = "edge-resolver"
version = "0.2.0"
description = "Internal edge resolver and asset endpoint"
requires-python = ">=3.12"
license = "Apache-2.0"
# One runtime dependency, and only because the standard library cannot mint the
# certificates the TLS listener issues per requested name. Everything else -- DNS wire
# format, HTTP, SMTP, LDAP/BER -- is hand-rolled on top of asyncio, because a full
# server for each protocol would be far more code than the few frames we answer.
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
edge-resolver = "edge_resolver.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_resolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
