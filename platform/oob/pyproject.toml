[project]
name = "ptaas-bench-oob"
version = "0.1.0"
description = "Out-of-band canary listener (DNS/HTTP/HTTPS/SMTP/LDAP) for ptaas-bench"
readme = { text = "See docstrings in src/bench_oob/.", content-type = "text/plain" }
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "own2pwn", email = "contact@own2pwn.fr" }]
# One runtime dependency, and only because the standard library cannot mint the
# self-signed certificate the HTTPS listener needs. Everything else -- DNS wire
# format, HTTP, SMTP, LDAP/BER -- is hand-rolled on top of asyncio, because a full
# server for each protocol would be far more code than the few frames we answer.
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bench-oob = "bench_oob.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench_oob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
