[project]
name = "benchctl"
version = "0.1.0"
description = "Scoring brain of ptaas-bench: reads the ground-truth catalog, turns collector events into reach/exercise/trigger scores, and renders comparison reports."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "own2pwn"}]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20",
]

[project.scripts]
bench = "benchctl.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
