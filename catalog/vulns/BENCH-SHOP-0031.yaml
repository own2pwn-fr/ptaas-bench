id: BENCH-SHOP-0031
title: Blind SSRF in the supplier catalogue import
app: shopfront
component: api
class: ssrf_blind
severity: high
entrypoint:
  method: POST
  path: /api/admin/imports
  auth: admin
  param: source_url
  param_in: json
  default_value: https://feeds.<the storefront domain>/catalogue/2026-01.csv
  content_type: application/json
discovery:
  render: spa-react
  reachable_from:
  - /admin/imports
  requires:
  - js-execution
  - custom-header
  - multi-step-flow
  difficulty: 4
oracle:
  kind: oob
  condition: 'The importer fetches any URL supplied by the caller and discards the body, so there is nothing
    to reflect. The sink declares the destination host to the egress correlation registry immediately
    before the fetch, and the trigger is raised by the sinkhole -- which is the DNS resolver for the whole
    target network -- when it observes a lookup or a connection to that host, whatever domain the tool
    chose, joined back to the request that declared it. Submitting a payload without ever causing a callback
    scores exercise only.

    '
  poc: POST /api/admin/imports {"source_url":"http://<any host the tool controls>/x"}
  signal: shop.imports.fetch.external
tags:
- rest
- oob
- authenticated
- admin
introduced: '2026-09-05'
decoy_note: Supplier catalogue import by URL is a normal back-office feature; the allowlist was dropped
  when a supplier moved to a CDN.
