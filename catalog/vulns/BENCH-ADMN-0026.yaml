id: BENCH-ADMN-0026
title: Layout cookie restored from an object stream on read
app: admin
component: api
class: deser_java
severity: critical
entrypoint:
  method: GET
  path: /api/workspace/layout
  auth: none
  param: mrd_layout
  param_in: cookie
  default_value: 
discovery:
  render: spa-angular
  reachable_from:
  - /
  requires:
  - js-execution
  difficulty: 5
oracle:
  kind: sink
  condition: 'The layout the shell renders before a session exists is carried in a cookie as a serialized
    object graph and decoded on read. A signal is raised when decoding the cookie actually executed code:
    the restore hook''s method body ran, or decoding created a child process. A cookie that only rebuilds
    fields, an absent cookie and an undecodable one never raise it.'
  poc: 'GET /api/workspace/layout with Cookie: mrd_'
  signal: console.session.layout_cookie_restore_ran
tags:
- rest
- deserialization
- unauthenticated
- cookie
introduced: '2026-09-05'
decoy_note: The shell has to paint something before sign-in, so the last layout is kept client-side in
  a cookie rather than in the database; it is the same serialized form the authenticated endpoint uses,
  which is why nobody thought of it as an untrusted input.
