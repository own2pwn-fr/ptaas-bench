id: BENCH-ADMN-0016
title: Saved workspace layout restored from a caller-supplied object stream
app: admin
component: api
class: deser_java
severity: critical
entrypoint:
  method: POST
  path: /api/workspace/layout/restore
  auth: user
  param: state
  param_in: json
  default_value: 
  content_type: application/json
discovery:
  render: spa-angular
  reachable_from:
  - /settings
  - /settings/workspace
  requires:
  - js-execution
  - multi-step-flow
  difficulty: 3
oracle:
  kind: sink
  condition: 'The saved layout is a serialized object graph, decoded straight from the request with no
    type filter. A signal is raised when restoring the graph actually executed code: the layout''s own
    restore hook ran its method body, or the restore call created a child process. A blob that only rebuilds
    fields, and one that fails to decode, never raise it.'
  poc: POST /api/workspace/layout/restore {"state":""}
    -- an object graph whose restore hook runs a command
  signal: console.workspace.layout.restore_hook_ran
tags:
- rest
- deserialization
- authenticated
introduced: '2026-09-05'
decoy_note: Workspace layouts were persisted with the platform's own object serialization when the feature
  shipped as a desktop client, and the web front end kept the format so that existing layouts would survive
  the migration.
