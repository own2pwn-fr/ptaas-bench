id: BENCH-ADMN-0019
title: Integration credentials written into the served application log
app: admin
component: api
class: log_secret_leak
severity: medium
entrypoint:
  method: GET
  path: /actuator/logfile
  auth: none
  param: null
  param_in: query
  default_value: null
discovery:
  render: api-only
  reachable_from:
  - /actuator
  requires:
  - wordlist
  difficulty: 2
oracle:
  kind: artifact
  condition: The integration refresh job logs the whole request it sends, secret included, at informational
    level, and the log file is served. A signal is raised when a served log body actually contained an
    integration secret in clear and that value matches a secret currently stored for an integration. A
    log body with the values redacted, or one that contains no secret, never raises it.
  poc: GET /actuator/logfile and read the credential printed by the integration refresh job
  signal: console.audit.logfile.credential_served
tags:
- logging
- unauthenticated
- chained
introduced: '2026-09-05'
decoy_note: The whole request is logged because a carrier kept claiming it never received the callbacks,
  and the quickest way to settle it was to print what was sent. The redaction filter covers the word "password"
  and the header named Authorization, neither of which is how this integration carries its secret.
requires_prereq:
- BENCH-ADMN-0014
