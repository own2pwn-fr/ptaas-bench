id: BENCH-CORP-0012
title: Report export answers an unknown format with the framework diagnostic page
app: corp
component: web
class: verbose_error
severity: medium
entrypoint:
  method: GET
  path: /reports/export
  auth: user
  param: format
  param_in: query
  default_value: xlsx
discovery:
  render: server-template
  reachable_from:
  - /reports
  requires: []
  difficulty: 2
oracle:
  kind: artifact
  condition: The reporting area was left with the framework's developer diagnostic page attached, so an
    exception there renders a stack trace and the environment of the process. The sink fires on the response,
    after the diagnostic body has been written, and only when that body actually contains internal detail
    a visitor should not be able to read -- a stack frame and the data source settings. A handled error
    page does not fire it.
  poc: GET /reports/export?format=ods with the session cookie of a signed-in employee
  signal: corp.reports.export.diagnostic_disclosed
tags:
- authenticated
- disclosure
introduced: '2026-09-05'
decoy_note: The reporting module is maintained by a different team who kept the diagnostic page behind
  what they believed was an internal-only path so they could read failures from the production instance.
