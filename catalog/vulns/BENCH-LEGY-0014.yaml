id: BENCH-LEGY-0014
title: Response header injection in the tracked outbound link
app: legacy
component: web
class: crlf_injection
severity: medium
entrypoint:
  method: GET
  path: /go.php
  auth: none
  param: ref
  param_in: query
  default_value: BT-4471
discovery:
  render: server-template
  reachable_from:
  - /product.php
  - /literature.php
  requires: []
  difficulty: 2
oracle:
  kind: sink
  condition: |
    The tracked link handler copies the reference into a response header through the server's own header directive, which does not filter control characters the way the interpreter's header function does. The sink reports when the value that reached that header contained a line break followed by a syntactically complete second field -- a token, a colon and a value -- so the response header block carried a field the application never set. A bare line break that forms no field, and a value with no line break at all, never report.
  poc: GET /go.php?ref=BT-4471%0d%0aX-Cache-Note:%20split
  signal: redirect.reference.field_split
tags:
- header
- server-rendered
introduced: '2026-09-05'
decoy_note: Marketing wanted click attribution without a third-party tag, so the reference is echoed back
  in a response header and read off the access log.
