id: BENCH-INFR-0010
title: Job queue on a non-standard port with no password
app: infra
component: db
class: db_exposed
severity: high
entrypoint:
  method: GET
  path: infra-redis-ops:6380
  auth: none
  param: null
  default_value: null
discovery:
  render: non-http
  reachable_from: []
  requires: []
  difficulty: 3
oracle:
  kind: artifact
  condition: >
    The queue the maintenance jobs run through listens on a port outside the range most
    scans cover, and, like the page cache, has no password. Reaching it and reading its
    banner is not counted. The counter moves when the datastore reports having executed,
    for a client outside the estate's own address range, a command that returned stored
    data -- an enumeration of the keyspace that had keys to return, or a read of a key
    that exists. The two stores of the same kind that do require a password reject these
    commands before executing them and can never move it.
  poc: 'redis-cli -h infra-redis-ops -p 6380 SCAN 0 then GET on one of the keys returned'
  signal: infra.queue.keyspace.read
notes: >
  Not an HTTP endpoint: the entrypoint is the socket the store answers on, written as
  host and port with no scheme, because a scheme would be read as a URL and reduce the
  whole address to a path.
tags:
- datastore
- redis
- anonymous
- network
- non-default-port
introduced: '2026-09-05'
decoy_note: >
  A second instance was stood up beside the first so that a long maintenance job could
  not evict the page cache; it was given the next port along and inherited the first
  one's configuration, password setting included -- which is to say, none.
