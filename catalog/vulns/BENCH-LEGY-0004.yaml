id: BENCH-LEGY-0004
title: Local file inclusion in the help article loader
app: legacy
component: web
class: lfi
severity: critical
entrypoint:
  method: GET
  path: /help.php
  auth: none
  param: topic
  param_in: query
  default_value: delivery-times.php
discovery:
  render: server-template
  reachable_from:
  - /
  - /help.php
  requires: []
  difficulty: 1
oracle:
  kind: sink
  condition: |
    The help page joins the parameter to the article directory and includes the result. The sink reports when the canonical path of the file the include actually resolved to lies outside that directory AND the include produced output that was written into the response. A path that resolves back inside the article directory, and one that resolves outside but yields nothing, never report: the record is of a file having been read out, not of a traversal sequence having been sent.
  poc: GET /help.php?topic=../../../../../etc/passwd
  signal: help.article.include_scope
tags:
- server-rendered
- include
introduced: '2026-09-05'
decoy_note: Help articles are ordinary partial templates on disk and the loader was written to take a
  file name, so the links in the footer pass one. Nobody wrote the check because the only caller was the
  footer.
