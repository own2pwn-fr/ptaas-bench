id: BENCH-BLOG-0003
title: Archive filter mini-language is spliced into a server-side predicate
app: blog
component: api
class: nosqli_js
severity: critical
entrypoint:
  method: GET
  path: /api/articles/archive
  auth: none
  param: match
  param_in: query
  default_value: year==2026
discovery:
  render: spa-vue
  reachable_from:
  - /archive
  - /
  requires:
  - js-execution
  difficulty: 3
oracle:
  kind: sink
  condition: 'The archive page offers a compact filter syntax over publication metadata, and the handler
    rewrites it into a JavaScript predicate the database runs per document. The counter moves when the
    predicate that was executed contains text the mini-language cannot produce AND the query either returned
    documents the request''s own intended filter excludes, or took more than a second longer than that
    intended filter -- either one being proof the submitted JavaScript actually ran inside the database.
    A payload the parser rejects before the query, or one that changes neither the result nor the runtime,
    scores exercise only.

    '
  poc: GET /api/articles/archive?match=year%3D%3D2024'%20||%20'1'%3D%3D'1
  signal: blog.archive.query.server_side_eval
tags:
- rest
- mongodb
- unauthenticated
introduced: '2026-09-05'
decoy_note: The archive predates the aggregation rewrite. Its filter syntax was a two-hour favour for
  the desk, and translating it into a predicate string was three lines against the fifty a proper compiler
  to query operators would have taken.
