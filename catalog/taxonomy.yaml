# Vulnerability taxonomy for ptaas-bench.
#
# Two things live here and nowhere else:
#   1. The three OWASP Top 10 editions, verbatim, so the comparison tables can be
#      rebuilt for any edition without touching a single vulnerability file.
#   2. The class registry: every planted vulnerability declares a `class`, and the
#      class supplies the default CWE / OWASP mapping / severity. A vulnerability
#      file only overrides these when its instance is genuinely more specific.
#
# Adding a class is cheap; renaming one is not (catalog files reference it by key).

editions:
  "2017":
    A01: Injection
    A02: Broken Authentication
    A03: Sensitive Data Exposure
    A04: XML External Entities (XXE)
    A05: Broken Access Control
    A06: Security Misconfiguration
    A07: Cross-Site Scripting (XSS)
    A08: Insecure Deserialization
    A09: Using Components with Known Vulnerabilities
    A10: Insufficient Logging & Monitoring
  "2021":
    A01: Broken Access Control
    A02: Cryptographic Failures
    A03: Injection
    A04: Insecure Design
    A05: Security Misconfiguration
    A06: Vulnerable and Outdated Components
    A07: Identification and Authentication Failures
    A08: Software and Data Integrity Failures
    A09: Security Logging and Monitoring Failures
    A10: Server-Side Request Forgery (SSRF)
  "2025":
    A01: Broken Access Control
    A02: Security Misconfiguration
    A03: Software Supply Chain Failures
    A04: Cryptographic Failures
    A05: Injection
    A06: Insecure Design
    A07: Authentication Failures
    A08: Software or Data Integrity Failures
    A09: Security Logging and Alerting Failures
    A10: Mishandling of Exceptional Conditions

# family groups the classes for the per-family comparison table, which is the view
# most readers actually want ("who is better at injection?") independent of edition.
families: [injection, xss, access-control, ssrf, crypto, auth-session, misconfig,
           supply-chain, deserialization, file, business-logic, protocol, dos, logging]

