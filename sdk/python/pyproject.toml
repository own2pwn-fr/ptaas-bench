[project]
name = "ptaas-bench-sdk"
version = "1.0.0"
description = "Ground-truth instrumentation for ptaas-bench target applications (Flask / FastAPI / Starlette)."
readme = { text = "See sdk/python/src/ptaas_bench_sdk/__init__.py for the documented public API.", content-type = "text/plain" }
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# httpx only: the SDK is injected into deliberately vulnerable targets, so every
# extra dependency is both a supply-chain risk and a component the tool under test
# could fingerprint. stdlib does the rest.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "flask>=3.0",
    "starlette>=0.37",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptaas_bench_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
