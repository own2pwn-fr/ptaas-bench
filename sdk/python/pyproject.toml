[project]
name = "telemetry-agent"
version = "1.0.0"
description = "Internal telemetry agent: request records, application signals and dependency links for Python services."
readme = { text = "See src/telemetry_agent/__init__.py for the documented public API.", content-type = "text/plain" }
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# httpx only. Every extra dependency is another thing to patch in every service that
# loads the agent, and the standard library does the rest.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "flask>=3.0",
    "starlette>=0.37",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
