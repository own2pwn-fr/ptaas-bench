# Local development only. Puts the console on a workstation's loopback so a developer
# can open it without a route into the estate; never up during a measured window.
worker_processes 1;
events { worker_connections 256; }

http {
    access_log off;
    server {
        listen 80;
        server_name localhost;
        client_max_body_size 128m;

        location / {
            proxy_pass http://web01:8080;
            proxy_set_header Host meridian.calderwood.example;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }
    }
}
