# Meridian operations console.
#
# Everything a deployment changes is an environment variable; the defaults below are
# what the container image runs with.

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
  tomcat:
    max-http-form-post-size: 128MB
    max-swallow-size: 128MB
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

spring:
  application:
    name: meridian
  main:
    banner-mode: off
  datasource:
    url: ${MERIDIAN_DB_URL:jdbc:mysql://ledger-db:3306/meridian?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MERIDIAN_DB_USER:meridian}
    password: ${MERIDIAN_DB_PASSWORD:meridian}
    hikari:
      maximum-pool-size: 12
      # Long enough for the quarter-end reports finance runs by hand.
      connection-timeout: 30000
      # A statement that has not come back in this long is not coming back.
      validation-timeout: 5000
  servlet:
    multipart:
      max-file-size: 96MB
      max-request-size: 128MB
  task:
    execution:
      pool:
        core-size: 4
        max-size: 12
        queue-capacity: 200
      thread-name-prefix: meridian-task-
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        cachecontrol:
          max-age: 3600

logging:
  file:
    name: ${MERIDIAN_LOG_FILE:/var/log/meridian/console.log}
  level:
    root: INFO
    com.calderwood.meridian: INFO
    org.springframework.web: WARN
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # Widened during the memory investigation in March; the management port is
        # supposed to be reachable only from the estate.
        include: "*"
  endpoint:
    health:
      show-details: always
    heapdump:
      access: read_only
    logfile:
      external-file: ${MERIDIAN_LOG_FILE:/var/log/meridian/console.log}
  info:
    env:
      enabled: true

info:
  app:
    name: Meridian
    release: ${MERIDIAN_RELEASE:4.11.2}
    owner: Platform Engineering, Calderwood Group

meridian:
  release: ${MERIDIAN_RELEASE:4.11.2}
  directory:
    url: ${DIRECTORY_URL:ldap://directory:389}
    base: ${DIRECTORY_BASE:dc=calderwood,dc=example}
    bind-dn: ${DIRECTORY_BIND_DN:cn=admin,dc=calderwood,dc=example}
    bind-password: ${DIRECTORY_BIND_PASSWORD:}
  data:
    tariffs: ${MERIDIAN_DATA:/opt/meridian/data}/tariffs.xml
    statements: ${MERIDIAN_DATA:/opt/meridian/data}/statements
    stylesheets: ${MERIDIAN_DATA:/opt/meridian/data}/stylesheets
  imports:
    staging: ${MERIDIAN_IMPORT_STAGING:/var/lib/meridian/imports}
  integrations:
    allowed-domains: ${MERIDIAN_HOOK_DOMAINS:calderwood.example,calderwood-freight.example}
    refresh-delay-ms: ${MERIDIAN_REFRESH_DELAY_MS:20000}
    refresh-interval-ms: ${MERIDIAN_REFRESH_INTERVAL_MS:180000}
