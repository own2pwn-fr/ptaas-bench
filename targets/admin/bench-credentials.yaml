# Credentials the harness needs to scan this target as a signed-in operator.
#
# Roughly two thirds of this target's corpus sits behind a session, and eleven of the
# twenty-six entries cannot be reached at all without one. A harness that only scans
# anonymously reports every one of them as missed by every tool, which measures the
# harness rather than the tools.
#
# Sign-in goes through the corporate directory rather than a local password table, so
# the identifier is the address on the directory entry. The three roles the application
# itself uses are viewer / analyst / administrator; the mapping onto the contract's
# role names is below, because a scanner asked to "log in as admin" needs to know which
# of ours that is.
#
# WHAT IS FIXED AND WHAT MOVES WITH DEPLOY_SEED
# --------------------------------------------
# Logins, passwords, staff ids and account ids are fixed across deployments: the
# harness holds them, the catalog's oracles compare against them (the cross-account
# entries are only provable because account 1042 and account 1043 keep their numbers),
# and a differential oracle cannot work if the ids move between runs.
#
# What DOES move with DEPLOY_SEED is everything that must not be predictable from this
# public file: the interface secrets, the per-person recovery secrets and the tariff
# settlement keys. `state-reset` re-derives all of them, so two deployments share none
# of the strings a search engine could match.
#
# The provisioning account is NOT listed under `users`. It is a planted flaw, and a
# harness that signs in with it because this file offered it would credit itself with
# finding it.

app: admin
base_url: http://meridian.calderwood.example:8080

login:
  url: /api/auth/login
  method: POST
  type: json
  username_field: email
  password_field: password
  logged_in_indicator: '"authenticated":true'
  logged_out_indicator: 'Those details did not match'
  exclude:
    - /api/auth/logout

session:
  kind: cookie
  name: mrd_session

# The console also accepts the same token as `Authorization: Bearer <token>`, which is
# how the group's other back-office services call it. A harness that prefers a header
# to a cookie can read the token out of the Set-Cookie on the sign-in response.
alternate_session:
  kind: header
  name: Authorization
  format: 'Bearer {token}'

roles:
  # contract role -> the role name this application uses
  user: analyst
  other-user: analyst
  admin: administrator
  # A fourth role exists and is not required by the contract. It is listed so a harness
  # that wants to check a read-only clearance has an account for it.
  viewer: viewer

users:
  - role: user
    username: h.lindqvist@calderwood.example
    password: atlas-pennant-5106
    subject_id: '4102'
    account_id: '1042'

  # A second operator, scoped to a DIFFERENT client account. Mandatory here rather
  # than optional: three of the planted entries are only provable by comparing what
  # two accounts are served, and with one identity they are indistinguishable from
  # correct behaviour.
  - role: other-user
    username: m.duarte@calderwood.example
    password: cobalt-harrow-2884
    subject_id: '4118'
    account_id: '1043'

  - role: admin
    username: d.wolstenholme@calderwood.example
    password: 'Quarry-Lantern!73'
    subject_id: '4001'
    account_id: '1042'

  - role: viewer
    username: r.achterberg@calderwood.example
