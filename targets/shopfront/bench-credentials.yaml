# Identities the harness signs in with, for the shopfront target.
#
# Roughly two thirds of this target's catalog sits behind a login, and two entries can
# only be proved from an account that does not own the resource, so `other-user` is not
# optional here: without it the differential checks on BENCH-SHOP-0014 and -0015 have
# nothing to compare against.
#
# THESE VALUES BELONG TO THE DEFAULT DEPLOY_SEED
# ----------------------------------------------
# The application generates its company, its catalogue and its customer base from
# DEPLOY_SEED at reset time, so that two deployments of the same image do not share the
# strings that would let a tool fingerprint one of them. Subject ids are fixed and never
# move; e-mail addresses and passwords do move.
#
# The values below are what `DEPLOY_SEED=gs-1` produces, which is the compose default.
# After changing DEPLOY_SEED, regenerate this file:
#
#     docker compose exec shopfront /usr/local/bin/state-reset --emit-credentials
#
# That prints the `app:` and `users:` blocks; the login and session blocks never change.

app: shopfront
base_url: http://shopfront:3000

login:
  url: /api/auth/login
  method: POST
  type: json
  username_field: email
  password_field: password
  # GET /api/auth/session answers {"status":"authenticated"} or
  # {"status":"unauthenticated"}, which is what a session probe should read.
  logged_in_indicator: 'authenticated'
  logged_out_indicator: 'unauthenticated'
  exclude:
    - /api/auth/logout
    - /api/account/sessions/{id}
    - /logout

session:
  kind: cookie
  name: sid

users:
  - role: user
    username: m.brennan@fenwickprovisions.example
    password: Pebble-Sable-Orchard-1078=
    subject_id: '1001'
  - role: other-user
    username: d.whitcombe@fenwickprovisions.example
    password: Quarry-Kestrel-Marram-5525=
    subject_id: '1002'
  - role: admin
    username: b.halloran@fenwickprovisions.example
    password: Orchard-Harbour-Willow-5246!
    subject_id: '1'
