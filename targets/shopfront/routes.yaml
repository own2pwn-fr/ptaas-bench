# Route inventory for the shopfront target.
#
# The denominator for crawl coverage and for precision. Every route the deployed service
# answers is listed here exactly once, under the template the framework registers rather
# than under a concrete URL, so that a report can say "reached 42 of 161" and mean it.
#
# `status: planted` marks a route that carries at least one catalog entry; the note names
# the entries and says which input is the one that matters. Everything else is `safe`, and
# a finding reported against a safe route is a false positive rather than an unmatched
# one. There are 137 safe routes to 26 planted ones.
#
# Two things worth knowing when reading the numbers this file produces:
#
#   * Nothing on this target is reachable without executing JavaScript. The document
#     routes all serve one shell, the API is JSON only and there is no server-rendered
#     link anywhere. The lowest crawl difficulty in the catalog is therefore 2, not 1;
#     that is the property this target exists to measure, not an oversight.
#   * `auth: none` on a document route means the shell is served to anyone. The page
#     behind it may still refuse to show anything without a session; the guard is in the
#     client, which is exactly why an authenticated crawl finds a different surface.
#
app: shopfront
