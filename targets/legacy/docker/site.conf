# The trade site.

ServerName www.braithwaite-tool.net
ServerAdmin it@braithwaite-tool.net

<VirtualHost *:80>
    ServerName www.braithwaite-tool.net
    ServerAlias braithwaite-tool.net
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # The URLs are the ones the site has always had. Nothing is served from a file
        # of that name any more, so anything that is not on disk goes to the front
        # controller, which holds the same list of paths.
        #
        # This is a rewrite rather than FallbackResource because the interpreter claims
        # every .php name with a handler of its own, and the fallback only applies to a
        # request no module has claimed -- so with FallbackResource alone the whole
        # catalogue, which is .php names to a customer, answers 404. The paperwork
        # folder is left out: a missing delivery note is a missing file, not a page.
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/uploads/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.php [L]
    </Directory>

    <Directory /var/www/html/uploads>
        # Delivery paperwork is kept under the document root so that a signed note can
        # be linked straight back to the customer record from the account area.
        Options -Indexes
        Require all granted
        RewriteEngine Off
    </Directory>

    # Click attribution for the tracked links in the catalogue mailshot. Marketing read
    # this off the access log rather than putting a third-party tag on the page.
    Header always set X-Link-Reference "%{BT_LINK_REF}e" env=BT_LINK_REF

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
