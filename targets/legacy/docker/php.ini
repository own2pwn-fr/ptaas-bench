; Interpreter settings for the trade site.
;
; The web servers and the command-line jobs share this file, which is why the settings
; that only make sense for one of them are guarded by the code rather than by the
; profile.

; The observability agent is wired in here rather than from the application's own
; bootstrap, so that requests the front controller never sees -- anything served
; straight out of the attachment folder -- are counted too, and so the agent can be
; upgraded on its own.
auto_prepend_file = /var/www/app/prepend.php

; Panels on the console can be pointed at the reporting box on the other rack rather
; than at a partial in the folder, which is what these two allow.
allow_url_fopen = On
allow_url_include = On

; Customers must never be shown an interpreter message. They go to the log instead,
; which the depot's monitoring reads.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING
error_log = /dev/stderr

; Sessions. The name and the cookie settings were set once, in 2009, and the depot
; terminals have been carrying them ever since.
session.name = BTSESSID
session.save_path = /var/lib/php/sessions
session.use_strict_mode = 0
session.use_only_cookies = 0
session.use_trans_sid = 0
session.cookie_httponly = 0
session.cookie_secure = 0
session.cookie_samesite =
session.gc_maxlifetime = 7200

; Delivery photographs come off a phone, so they are not small.
upload_max_filesize = 16M
post_max_size = 20M
max_file_uploads = 10
memory_limit = 256M
max_execution_time = 60

date.timezone = Europe/London
default_charset = UTF-8
