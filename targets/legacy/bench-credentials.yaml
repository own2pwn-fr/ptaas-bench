# Credentials the harness needs to scan this target as a signed-in trade customer and as
# a member of staff.
#
# Roughly a third of this target's surface is behind the sign-in and a further slice is
# behind the staff console, so a harness that only scans anonymously would report every
# authenticated flaw as missed by every tool, which measures nothing.
#
# Logins and passwords are fixed across deployments because the harness, the release
# checks and the support desk all hold them. Everything else a visitor can see -- company
# names, people, product descriptions, references -- is derived from DEPLOY_SEED at reset
# time, so two deployments of the same release do not share the strings that would make
# one recognisable from the other. Two exceptions are fixed by necessity rather than by
# choice, and both are recorded in the catalog: the product reference BT-4471, which is
# the code printed on the counter cards, and the two customer companies the fixed logins
# belong to.
#
# The domain follows LEGACY_SITE_DOMAIN. If that is overridden at deploy time the local
# parts below stay the same and only the staff address moves with it.

app: legacy
base_url: http://www.braithwaite-tool.net

login:
  url: /account/login.php
  method: POST
  type: form
  username_field: email
  password_field: password
  logged_in_indicator: 'Your account'
  logged_out_indicator: 'Forgotten your password?'
  exclude:
    - /account/logout.php

session:
  kind: cookie
  name: BTSESSID

users:
  - role: user
    username: j.hartley@fenwick-joinery.example
    password: bramble-cutting-7231
    subject_id: '2041'
  # A second trade account on a different customer, so a tool can compare two identities.
  # It matters here: the order history filter is one of the places where a statement is
  # built by hand, and rows belonging to this account appearing under the other one is
  # what proves it.
  - role: other-user
    username: m.novak@ridgeway-groundworks.example
    password: granite-lintel-9840
    subject_id: '2042'
  # Staff. The console is an ordinary part of the site behind the same sign-in form; it
  # is not on a separate host and there is no second password.
  - role: admin
    username: s.pardoe@braithwaite-tool.net
    password: 'Kingsway-Depot!14'
    subject_id: '11'
