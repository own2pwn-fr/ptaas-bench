# Route inventory for the trade site.
#
# Two uses, both of which fix a measurement bias. Crawl coverage over the WHOLE reachable
# surface rather than only the parts we made interesting, because reach measured over
# planted vulnerabilities alone counts only the pages that were built to be found. And a
# real false-positive denominator: a finding reported against a route declared `safe`
# here is a confirmed false positive rather than merely unmatched.
#
# Ratio: 97 safe endpoints to 23 planted, i.e. 4.2:1, comfortably past the
# 3:1 the target contract asks for. That matters more on this target than on any other in
# the corpus. This is the control group -- discovery is nearly free, everything is
# server-rendered, every form is in the initial HTML -- so what it measures is testing
# skill rather than crawling skill, and that reading only holds if a tool can be wrong
# here. An application where every parameter is exploitable measures nothing.
#
# Paths are the templates the front controller registers (app/routes.php), which is what
# the catalog entrypoints are written against and what the instrumentation reports.
#
# THREE ROUTES ARE DELIBERATELY ABSENT, and their absence is the honest answer rather
# than a gap:
#
#   /uploads/{file}        Served straight off disk by the web server, not by the front
#                          controller. It is where BENCH-LEGY-0009 is OBSERVED -- an
#                          uploaded script running -- while the entry point that plants it
#                          is POST /account/documents.php. Declaring it `safe` would
#                          publish a correct finding about code execution there as a false
#                          positive; declaring it `planted` would name a route no catalog
#                          entry describes. It is therefore neither, and a finding on it
#                          is unmatched, which is the truthful state.
#
#   /admin/enquiries.php   Same shape, one hop further. It is where the CSV that carries
#                          BENCH-LEGY-0017 is served, while the injection point is the
#                          anonymous POST /contact.php. Absent for the same reason.
#
#   /assets/{file}         Static files served by the web server with no interpreter in
#                          the path, so no request record exists for them and counting
#                          them in coverage would deflate every tool's number equally for
#                          no information.
#
# /index.php is also absent: it is an alias of / , which is already listed as planted, and
# listing it separately would double-count one page in both the coverage numerator and the
# precision denominator.

app: legacy

routes:

