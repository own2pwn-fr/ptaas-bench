# Credentials the harness needs to scan this target as a signed-in employee.
#
# Roughly two thirds of this target's surface is behind the sign-in page, so a harness
# that only scans anonymously reports every authenticated flaw as missed by every tool,
# which measures nothing.
#
# Logins and passwords are fixed across deployments because the harness, the release
# checks and the service desk all hold them. Everything else about these accounts -
# nicknames, the keys their badge and their share links are built with, the documents
# they can see - is derived from DEPLOY_SEED, because those are the values that must not
# be predictable from anything published.
#
# The `other-user` account is mandatory and is genuinely a second identity, not a copy:
# it sits in a different cost centre and a different team, so a differential comparison
# between the two is meaningful. It is also the account the destructive form check uses,
# because that check closes the account it runs against and the first account is needed
# for the rest of the replay.
#
# The domain follows CORP_SITE_DOMAIN. If that is overridden at deploy time the local
# parts stay the same and only the domain moves.

app: corp
base_url: http://portal.meridian-castings.net

login:
  url: /signin
  method: POST
  type: form
  username_field: email
  password_field: password
  logged_in_indicator: 'Your workspace'
  logged_out_indicator: 'Those details did not match'
  exclude:
    - /signout
    - /account/profile

session:
  kind: cookie
  name: PORTALSESSION

