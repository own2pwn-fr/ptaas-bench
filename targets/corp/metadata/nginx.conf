# Instance metadata service.
#
# Answers the conventional link-local address with the tree an instance exposes about
# itself. Everything is plain text, there is no directory index beyond the listing files
# the tree ships, and nothing is writable.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;
    default_type text/plain;
    charset utf-8;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 80 default_server;
        server_name _;
        root /srv/metadata;
        index index.txt;

        location = / {
            return 200 "1.0\n2016-09-02\nlatest\n";
        }

        location / {
            try_files $uri $uri/index.txt =404;
        }
    }
}
