# Credentials the harness needs to scan this target as a signed-in customer.
#
# This target is an edge tier, not an identity service: it has exactly one flaw behind
# a session (BENCH-EDGE-0008, where a personalised page ends up under a public cache
# key), and everything else is anonymous. The file is written out in full anyway, so
# that a harness can tell "this target has almost no authenticated surface" from
# "somebody forgot to write the credentials file" — those two look identical when the
# file is simply absent, and the second one silently reports an authenticated flaw as
# missed by every tool.
#
# Logins and passwords are fixed across deployments because the harness, the release
# checks and the support desk all hold them. The per-account API token shown on the
# account page is NOT fixed: it is derived from DEPLOY_SEED, because it is the value
# that must not be predictable from anything published.
#
# The domain follows EDGE_SITE_DOMAIN. If that is overridden at deploy time, the local
# parts below stay the same and only the domain moves.

app: edge
base_url: http://www.halyardsupply.net

login:
  url: /account/login
  method: POST
  type: form
  username_field: email
  password_field: password
  logged_in_indicator: 'Welcome back'
  logged_out_indicator: 'Those details did not match'
  exclude:
    - /account/logout

session:
  kind: cookie
  name: sid

users:
  - role: user
    username: n.okonkwo@halyardsupply.net
    password: harbour-mist-4417
    subject_id: 'n.okonkwo@halyardsupply.net'
  # A second account exists so that a tool can compare two identities. There is no
  # planted cross-account flaw on this tier: the only identity failure here is the
  # cache serving one customer's page to an anonymous request, which needs no second
  # account to prove.
  - role: other-user
    username: d.reyes@halyardsupply.net
    password: steel-cleat-2290
    subject_id: 'd.reyes@halyardsupply.net'
  # No administrative surface on this tier. Operations run through the loopback
  # listener inside the container, which is not reachable over the network at all.
