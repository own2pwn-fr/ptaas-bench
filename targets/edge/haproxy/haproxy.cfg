# Load balancer for the storefront.
#
# PINNED TO haproxy 2.0.29 (see compose/edge.yml), and the pin is load-bearing:
#
#   `no option http-use-htx` only exists in the 2.0 series.
#
# HTX became the default in 2.0 and the previous parser was removed in 2.1. We are
# still on the previous one because HTX rejects the coding headers two partners send
# (the payments vendor's callbacks, and the warehouse EDI feed), and both refused to
# change inside our contract term. EDGE-441 tracks the migration; it has been open
# for a while.
#
# The practical difference is that the old parser treats a message as a list of
# headers rather than as a structure, so it forwards Content-Length and
# Transfer-Encoding onward roughly as it found them and applies a shallow test to
# decide which one frames the body. The origin has to be tolerant in the same places,
# which is why it reads the wire itself (targets/edge/origin/wire.go).

global
    log stdout format raw local0 info
    maxconn 2048

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout http-keep-alive 60s

    # See the header comment. Do not remove without closing EDGE-441 first.
    no option http-use-htx

    # The warehouse EDI feed sends header names containing underscores and pads some
    # values with control characters. Without this we answer 400 to a partner whose
    # integration predates the contract.
    option accept-invalid-http-request

    option http-keep-alive
    option forwardfor

frontend fe_public
    # The tier in front is a TCP relay, so the customer's address arrives out of band.
    # Without accept-proxy every request would look like it came from that container.
    bind :80 accept-proxy

    # Client address as this tier sees it, for the origin's accounting. `set-header`
    # deletes any copy the client sent before adding ours, so downstream can rely on
    # it; `add-header` here would let a customer forge their own address.
    http-request set-header X-Real-IP %[src]

    # Received-protocol and this hop's name, per RFC 9110. Appended, not replaced,
    # so a chain of intermediaries reads correctly end to end.
    http-request add-header Via "1.1 edge-lb"

    # Only safe, bodyless methods go to the cache. Everything with a body goes direct:
    # the cache tier rewrites request framing on its way through, which broke the EDI
    # feed the one time we routed POSTs through it.
    acl is_cacheable method GET HEAD
    use_backend be_cache if is_cacheable
    default_backend be_origin

backend be_cache
    server varnish varnish:80 maxconn 200

backend be_origin
    # Connection reuse across clients. Cut origin connection churn by an order of
    # magnitude when we turned it on; `safe` was retiring connections after almost
    # every request because the origin does not advertise keep-alive the way the
    # policy expects.
    http-reuse always
    server origin origin:8080 maxconn 200
