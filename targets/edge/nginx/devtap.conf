# Development-only port tap. Not part of the `targets` profile.
#
# The estate's networks have no route to the host, by design: it keeps anything
# published on a developer's loopback out of reach of a container that has been taken.
# This exists so that a developer can still drive the storefront from their own
# machine, and it must never be started outside local development.
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
stream {
    server { listen 80;   proxy_pass nginx:80;   proxy_timeout 120s; }
    server { listen 8081; proxy_pass nginx:8081; proxy_timeout 120s; }
}
