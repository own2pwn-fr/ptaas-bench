# Credentials for the `blog` target, per targets/target-contract.yaml.
#
# Roughly half of this target's corpus sits behind a session, and three of its oracles
# are differential: they only fire when a request is served to an identity that does
# not own what came back. That needs a second, non-owning account, which is what
# `other-user` is for -- it is not a spare, it is half of the measurement.
#
# The values below are the ones the default deployment seed produces (masthead
# "Cranleigh Observer", domain cranleighobserver.com; both are derived from the seed
# too, so a deployment that sets DEPLOY_SEED is a different paper entirely). Content and
# logins are both derived from DEPLOY_SEED, so a deployment that sets it has different
# ones: regenerate them with
#
#     docker compose exec blog-web /opt/venv/bin/python -m pressroom.seed --accounts
#
# which prints role, address, passphrase and account id for every provisioned account.

app: blog
# The container listens on 8000 and nothing publishes or rewrites that, so the port
# belongs in the address: a tool pointed at the bare hostname is refused at the
# transport layer on every request and publishes as a crawler that found nothing.
# `press01` is an alias on both networks, so this address works from the tool's network
# and from the estate's.
base_url: http://press01:8000

login:
  url: /api/auth/session
  method: POST
  type: json
  username_field: email
  password_field: password
  logged_in_indicator: 'authenticated'
  logged_out_indicator: 'unauthenticated'
  exclude:
    - /api/auth/session      # DELETE on this path ends the session
    - /api/account/password  # changes the passphrase this file documents
    - /api/auth/recover/complete

session:
  kind: cookie
  name: ng_session

users:
  # A staff writer. Owns dft-2002-01..03; the studio, the composer, the picture desk
  # and the readership reports are all reachable from here.
  - role: user
    username: c.duchesne@cranleighobserver.com
    password: beacon-bracken-5081
    subject_id: 'usr-1002'

  # A second staff writer who owns nothing the first one owns. Owns dft-2003-01..03.
  # The draft-ownership oracle is written against exactly this pairing.
  - role: other-user
    username: n.cardoso@cranleighobserver.com
    password: cormorant-windlass-9892
    subject_id: 'usr-1003'

  # The managing editor: the only role that reaches the moderation queue and the
  # plugin installer.
  - role: admin
    username: m.arrigoni@cranleighobserver.com
    password: capstan-quarry-4803
    subject_id: 'usr-1001'

notes: >
  Readers who came over from the paper's old forum sign in with an emailed code
  instead of a passphrase: POST /api/auth/session with `email` and `code` rather than
  `email` and `password`. Both branches issue the same cookie.
