# Development tap only. Publishes the site on the developer's machine; it is never
# part of a measured run, because it is a route from the host into a sealed network.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://blog-web:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
