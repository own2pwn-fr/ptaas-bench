  - {path: '/api/media/{asset_id}',     method: GET,    auth: none,       render: spa-vue,     params: [asset_id],            status: planted}
  - {path: '/api/media/{asset_id}/derivative', method: GET, auth: none,   render: spa-vue,     params: [asset_id, width],     status: safe}
  - {path: '/api/preview/{token}',      method: GET,    auth: none,       render: spa-vue,     params: [token],               status: planted}

  # ---- newsletter ----
  - {path: '/api/newsletter/issues',    method: GET,    auth: none,       render: spa-vue,     params: [page],                status: safe}
  - {path: '/api/newsletter/issues/{issue_number}', method: GET, auth: none, render: spa-vue,  params: [issue_number],        status: safe}
  - {path: '/api/newsletter/subscribe', method: POST,   auth: none,       render: spa-vue,     params: [email, cadence],      status: safe}
  - {path: '/api/newsletter/preferences', method: POST, auth: none,       render: spa-vue,     params: [email, token, cadence, topics], status: planted}
  - {path: '/api/newsletter/preview',   method: POST,   auth: user,       render: spa-vue,     params: [subject, issue],      status: planted}

  # ---- sessions and accounts ----
  - {path: '/api/auth/session',         method: GET,    auth: none,       render: spa-vue,     params: [],                    status: safe}
  - {path: '/api/auth/session',         method: POST,   auth: none,       render: spa-vue,     params: [email, password, code], status: planted}
  - {path: '/api/auth/session',         method: DELETE, auth: user,       render: spa-vue,     params: [],                    status: safe}
  - {path: '/api/auth/register',        method: POST,   auth: none,       render: spa-vue,     params: [email, password, display], status: safe}
  - {path: '/api/auth/recover',         method: POST,   auth: none,       render: spa-vue,     params: [email],               status: planted}
  - {path: '/api/auth/recover/complete', method: POST,  auth: none,       render: spa-vue,     params: [token, password],     status: safe}
  - {path: '/api/account/profile',      method: GET,    auth: user,       render: spa-vue,     params: [],                    status: safe}
  - {path: '/api/account/profile',      method: PATCH,  auth: user,       render: spa-vue,     params: [display, cadence, email], status: safe}
  - {path: '/api/account/password',     method: POST,   auth: user,       render: spa-vue,     params: [current, replacement], status: safe}
  - {path: '/api/account/bookmarks',    method: GET,    auth: user,       render: spa-vue,     params: [page],                status: safe}
  - {path: '/api/account/bookmarks',    method: POST,   auth: user,       render: spa-vue,     params: [article],             status: safe}
  - {path: '/api/account/bookmarks/{article_slug}', method: DELETE, auth: user, render: spa-vue, params: [article_slug],      status: safe}
