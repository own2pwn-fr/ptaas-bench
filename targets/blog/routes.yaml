  - {path: '/api/articles/archive',     method: GET,    auth: none,       render: spa-vue,     params: [match, per_page],     status: planted}
  - {path: '/api/articles/{slug}',      method: GET,    auth: none,       render: spa-vue,     params: [slug, _trace],        status: planted}
  - {path: '/api/articles/{slug}/related',   method: GET,  auth: none,    render: spa-vue,     params: [slug],                status: safe}
  - {path: '/api/articles/{slug}/reactions', method: GET,  auth: none,    render: spa-vue,     params: [slug],                status: safe}
  - {path: '/api/articles/{slug}/reactions', method: POST, auth: none,    render: spa-vue,     params: [slug, kind],          status: safe}
  - {path: '/api/articles/{slug}/comments',  method: GET,  auth: none,    render: spa-vue,     params: [slug, page],          status: safe}
  - {path: '/api/articles/{slug}/comments',  method: POST, auth: none,    render: spa-vue,     params: [slug, body, name],    status: planted}
  - {path: '/api/articles/{slug}/summary',   method: POST, auth: none,    render: spa-vue,     params: [slug],                status: safe}
  - {path: '/api/comments',             method: GET,    auth: none,       render: spa-vue,     params: [article, include, page], status: planted}
  - {path: '/api/comments/{comment_id}',     method: GET,  auth: none,    render: spa-vue,     params: [comment_id],          status: safe}
  - {path: '/api/comments/{comment_id}/report', method: POST, auth: none, render: spa-vue,     params: [comment_id, reason],  status: safe}
  - {path: '/api/topics',               method: GET,    auth: none,       render: spa-vue,     params: [],                    status: safe}
  - {path: '/api/topics/{slug}',        method: GET,    auth: none,       render: spa-vue,     params: [slug],                status: safe}
  - {path: '/api/topics/{slug}/articles',    method: GET,  auth: none,    render: spa-vue,     params: [slug, page],          status: safe}
  - {path: '/api/authors',              method: GET,    auth: none,       render: spa-vue,     params: [topic, status, filter, page], status: planted}
  - {path: '/api/authors/{handle}',     method: GET,    auth: none,       render: spa-vue,     params: [handle],              status: safe}
  - {path: '/api/authors/{handle}/articles', method: GET,  auth: none,    render: spa-vue,     params: [handle, page],        status: safe}
  - {path: '/api/search',               method: GET,    auth: none,       render: spa-vue,     params: [q, page],             status: planted}
  - {path: '/api/search/suggest',       method: GET,    auth: none,       render: spa-vue,     params: [q],                   status: safe}
  - {path: '/api/reader/feed',          method: GET,    auth: none,       render: spa-vue,     params: [page, reader_prefs],  status: planted}
  - {path: '/api/reader/history',       method: GET,    auth: none,       render: spa-vue,     params: [reader_id],           status: safe}

  # ---- embeds and pictures ----
