  - {path: '/api/studio/assist',        method: POST,   auth: user,       render: spa-vue,     params: [draft_id, instruction], status: planted}
  - {path: '/api/studio/reports',       method: POST,   auth: user,       render: spa-vue,     params: [name, segment],       status: planted}
  - {path: '/api/studio/reports/{report_id}', method: GET, auth: user,    render: spa-vue,     params: [report_id],           status: safe}
  - {path: '/api/studio/media',         method: GET,    auth: user,       render: spa-vue,     params: [state, page],         status: safe}
  - {path: '/api/studio/media',         method: POST,   auth: user,       render: spa-vue,     params: [file, credit],        status: planted}
  - {path: '/api/studio/media/fetch',   method: POST,   auth: user,       render: spa-vue,     params: [source_url],          status: planted}
  - {path: '/api/studio/articles/import', method: POST, auth: user,       render: spa-vue,     params: [document],            status: planted}
