# Credentials the harness needs to scan this target.
#
# THERE IS NO LOGIN ON THIS TARGET, AND THAT IS THE ANSWER, NOT AN OMISSION.
#
# The estate is a marketing site served as files, plus the datastores behind it. There
# is no session, no account, no sign-in form and no cookie that means anything: every
# planted flaw here is reachable by an anonymous client, which is precisely what makes
# this target the floor of the corpus.
#
# The file is written out in full anyway, with an empty user list, because "this target
# has no authenticated surface" and "somebody forgot to write the credentials file" look
# identical when the file is simply absent -- and the second one silently reports an
# authenticated flaw as missed by every tool.

app: infra
base_url: http://www.northlakefab.com

# No login exists, so there is nothing for the harness to submit and nothing for it to
# check a response against. A harness that reads this file must scan anonymously and
# must not report the authenticated surface as unreachable: there is none.
login: null

session: null

users: []

# WHAT IS BEHIND A PASSWORD ON THIS ESTATE, AND WHY IT IS NOT LISTED ABOVE
#
#   docs.<domain>/api/    The maintained interface descriptions, behind an HTTP Basic
#                         realm ("Operations") whose account belongs to the operations
#                         team. It is deliberately NOT shared with the harness: the
#                         realm exists as the ordinary, correctly protected counterpart
#                         of the description that was left published on the public host,
#                         and a tool that reports it as exposed is wrong whether or not
#                         it holds the password. Its password is derived from
#                         DEPLOY_SEED, so it is not the same on two installations.
#
#   sessions / jobs / reports
#                         Three datastores of the same kinds as the planted ones, on the
#                         same network and answering on their usual ports, that require
#                         a password. Their passwords are set by the deployment
#                         (INFRA_SESSIONS_PASSWORD, INFRA_JOBS_PASSWORD,
#                         INFRA_REPORTS_PASSWORD in compose/infra.yml) and are not
#                         handed to the harness for the same reason: they are the
#                         denominator that makes "found an unauthenticated datastore"
#                         mean something.
#
# The settings file left in the public document root does contain working-looking
# credentials. They are for hosts on the management network, which is not reachable from
# where a tool sits, so nothing there turns into an unplanted way in.
