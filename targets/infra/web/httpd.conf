### Web server for the public site, the assets host and the handbook host.
###
### Written from the shipped example and cut down to what these three hosts use. The
### estate serves files and nothing else: no interpreter is loaded, no application is
### mounted, and no module of ours is in the request path.
###
### The two hosts at the bottom were rebuilt from the template the audit asked for, and
### carry the deny rules that came with it. The public host at the top predates that
### template and has never been reworked; it is the oldest configuration on the estate.

ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule alias_module modules/mod_alias.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule logio_module modules/mod_logio.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule filter_module modules/mod_filter.so

User daemon
Group daemon

ServerAdmin webmaster@northlakefab.com
ServerName www.northlakefab.com
UseCanonicalName Off

TypesConfig conf/mime.types
DefaultRuntimeDir /usr/local/apache2/logs
PidFile /usr/local/apache2/logs/httpd.pid

Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
HostnameLookups Off

# Nothing below the document roots is reachable unless a host asks for it.
<Directory />
    AllowOverride None
    Options None
    Require all denied
</Directory>

# The estate's log line, read by the metrics agent on the operations network. Fields,
# separated by a bar: time, peer, method, path, query, status, bytes written to the
# client, bytes read from it, host, agent. The peer is the address on the socket -- %a
# and never %h, because there is no proxy in front of these hosts and a name lookup per
# request would cost more than the line is worth.
LogFormat "%{%Y-%m-%dT%H:%M:%S%z}t|%a|%m|%U|%q|%>s|%O|%I|%{Host}i|%{User-Agent}i" estate
LogFormat "%h %l %u %t \"%r\" %>s %b" common

ErrorLog /var/log/site/error.log
LogLevel warn
CustomLog /var/log/site/access.log estate

AddDefaultCharset UTF-8

### ---------------------------------------------------------------------------
### The public site. First in the file, so it answers anything that arrives without a
### host we know.
### ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName www.northlakefab.com
    ServerAlias northlakefab.com www.* infra-web web01
    DocumentRoot /srv/sites/www

    <Directory /srv/sites/www>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # The media directory has no index page: the sales office uploads into it over
    # SFTP and finds last quarter's price list by looking. Switched on in 2019 and
    # never revisited.
    <Directory /srv/sites/www/media>
        Options +Indexes FollowSymLinks
        IndexOptions FancyIndexing NameWidth=* HTMLTable SuppressDescription
        IndexIgnore .. .DS_Store
    </Directory>

    # Downloads are large and are fetched once; a validator saves the transfer on the
    # second visit.
    <FilesMatch "\.(pdf|tar\.gz|tgz|zip|gz)$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
</VirtualHost>

### ---------------------------------------------------------------------------
### The assets host. Rebuilt from the hardened template after the audit: no listings,
### nothing beginning with a dot, and none of the leftovers a deployment can drop.
### ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName static.northlakefab.com
    ServerAlias static.* assets.*
    DocumentRoot /srv/sites/static

    <Directory /srv/sites/static>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Repository metadata, settings files and anything else beginning with a dot.
    <DirectoryMatch "/\.(git|svn|hg|bzr)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Archives and copies a deployment leaves behind.
    <FilesMatch "\.(bak|old|orig|save|swp|sql|tar|tar\.gz|tgz|zip)$">
        Require all denied
    </FilesMatch>

    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=604800"
    </IfModule>
</VirtualHost>

### ---------------------------------------------------------------------------
### The handbook host. Same template as the assets host, plus the operator login on the
### interface descriptions.
### ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName docs.northlakefab.com
    ServerAlias docs.* handbook.*
    DocumentRoot /srv/sites/docs

    <Directory /srv/sites/docs>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    <DirectoryMatch "/\.(git|svn|hg|bzr)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <FilesMatch "\.(bak|old|orig|save|swp|sql|tar|tar\.gz|tgz|zip)$">
        Require all denied
    </FilesMatch>

    # The maintained interface descriptions. Partners are given an account; everyone
    # else is asked for one.
    <Directory /srv/sites/docs/api>
        AuthType Basic
        AuthName "Operations"
        AuthUserFile /srv/private/operators
        Require valid-user
    </Directory>
</VirtualHost>
