# Development tap. Publishes staff services on the developer's machine and does
# nothing else: no caching, no rewriting, no buffering that would change what the
# application's own timing looks like.
#
# It is only ever brought up with `--profile dev`, never during a measured run.
worker_processes 1;
events { worker_connections 256; }

http {
    access_log off;
    server_tokens off;

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://staff-services:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
    }
}
