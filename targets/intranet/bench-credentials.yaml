# Credentials the harness needs to scan this target as a signed-in employee.
#
# Roughly two thirds of this target's surface is behind the sign-in screen, and four of
# the sixteen planted flaws are only provable from an account that does not own the
# record being touched. A harness that scanned anonymously would report those as missed
# by every tool, which measures nothing.
#
# Addresses and passwords are fixed across deployments because the harness, the release
# checks and the service desk all hold them; everything else about these accounts --
# their names, their equipment, their claims -- is generated from DEPLOY_SEED like the
# rest of the directory. The reset links shown on the sign-in screen are NOT fixed:
# they are minted per hour, which is the point of BENCH-INTR-0007.
#
# The domain follows SITE_DOMAIN. If that is overridden at deploy time the local parts
# stay the same and only the domain moves.

# The address staff type, on the network they are on. The application listens on 80
# there; the estate's own tooling reaches the same service as `staff-services` on the
# other network, which is what keeps our traffic and a tool's traffic apart.
app: intranet
base_url: http://hub.lanmarkfreight.net

login:
  url: /login
  method: POST
  type: form
  page_url: /login
  username_field: email
  password_field: password
  verify_url: /account
  logged_in_indicator: 'Signed in as'
  logged_out_indicator: 'Those details did not match'
  exclude:
    # Signing out does not end the session on this target, but a harness that follows
    # it still loses its cookie in the browser it is driving, and it would then scan
    # the rest of the surface anonymously while reporting itself authenticated.
    - /logout

session:
  kind: cookie
  name: hubsid

users:
  # Depot coordinator. Owns leave requests 4101, 4103 and 4105 and claims 8801, 8807,
  # 8815, so a tool signed in as this account has records of its own to compare with.
  - role: user
    username: j.hollis@lanmarkfreight.net
    password: harbour-lantern-5183
    subject_id: '1041'
  # A colleague on the same team with the same manager, deliberately NOT the first
  # account's approver: the four cross-account flaws have to be provable from an
  # account with no legitimate business touching the other one's records.
  - role: other-user
    username: p.rasmussen@lanmarkfreight.net
    password: cobble-thicket-2947
    subject_id: '1042'
  # IT Services, holds the operations role: the administration screens, the equipment
  # probe and the access controls on the directory.
  - role: admin
    username: s.varga@lanmarkfreight.net
    password: 'Wharfside-Beacon!41'
    subject_id: '1007'
