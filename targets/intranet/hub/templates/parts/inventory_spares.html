<h2>Spares and repairs</h2>
<table class="grid">
  <thead><tr><th>Tag</th><th>Model</th><th>State</th><th>Site</th></tr></thead>
  <tbody>{% for r in rows %}
  <tr class="clickable" hx-get="/parts/inventory/asset/{{ r.id }}" hx-target="#asset" hx-swap="innerHTML">
    <td>{{ r.tag }}</td><td>{{ r.model }}</td><td>{{ r.status }}</td><td>{{ r.site }}</td></tr>
  {% else %}<tr><td colspan="4">Nothing in store.</td></tr>{% endfor %}</tbody>
</table>
