<h2>{{ team }} calendar</h2>
<table class="grid">
  <thead><tr><th>Who</th><th>From</th><th>To</th><th>Status</th></tr></thead>
  <tbody>
  {% for r in rows %}<tr><td>{{ r.owner_name }}</td><td>{{ r.start_date }}</td><td>{{ r.end_date }}</td><td>{{ r.status }}</td></tr>
  {% else %}<tr><td colspan="4">Nobody is booked off.</td></tr>{% endfor %}
  </tbody>
</table>
