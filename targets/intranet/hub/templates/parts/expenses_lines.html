<table class="grid">
  <thead><tr><th>When</th><th>What</th><th>Category</th><th>Amount</th></tr></thead>
  <tbody>
  {% for l in lines %}<tr><td>{{ l.spent_on }}</td><td>{{ l.description }}</td><td>{{ l.category }}</td>
      <td>&pound;{{ '%.2f' % (l.amount_cents / 100) }}</td></tr>
  {% else %}<tr><td colspan="4">No lines yet.</td></tr>{% endfor %}
  </tbody>
  <tfoot><tr><th colspan="3">Total</th><th>&pound;{{ '%.2f' % (total / 100) }}</th></tr></tfoot>
</table>
{% if not claim.closed %}
<form hx-post="/parts/expenses/claim/{{ claim.id }}/lines" hx-target="#claim-lines" hx-swap="innerHTML">
  <label>What<input name="description" required></label>
  <label>Amount<input name="amount" placeholder="12.40" required></label>
  <label>Category<select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label>
  <button type="submit">Add line</button>
</form>
{% endif %}
