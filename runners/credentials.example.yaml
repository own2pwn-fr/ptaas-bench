# LOCAL FALLBACK ONLY -- the authority is targets/<app>/bench-credentials.yaml.
#
# Each target writes its own credentials file at seed time, in the shape fixed by
# targets/target-contract.yaml, and the harness reads it directly. That file is the
# authority for two things this one cannot be: the base URL (derived per deployment
# from DEPLOY_SEED, so anything hardcoded here is correct for exactly one deployment)
# and the seeded identities.
#
# This file exists for applications that have not landed yet. Copy it to
# runners/credentials.yaml (git-ignored); the moment targets/<app>/bench-credentials.yaml
# appears, that file wins and this one is ignored for that app. Preflight refuses to
# open a run against an application that has neither.
#
# A target with no login writes its file with an empty `users:` list and a comment,
# so that "this application has no authentication" can be told apart from "someone
# forgot to write the file". Only the second stops a run, and only when the catalog
# declares authenticated entrypoints for that application.
#
# Values support ${ENV_VAR} and ${ENV_VAR:-default} expansion, which is how
# passwords stay out of the file on a shared machine.
#
# Why this file exists at all: roughly half the planted corpus sits behind a login
# (catalog entries with `entrypoint.auth: user|admin|other-user`). A harness that
# only scanned anonymously would report every tool as blind to that half, which says
# nothing about the tools and everything about the harness. Each driver translates
# these fields into its own dialect -- a ZAP context, a wapiti --form-credentials, a
# nuclei header -- so there is exactly one place to fix when a login changes.
#
# Fields
#   kind             form | json | bearer | basic     how the login request is shaped
#   login_url        where credentials are POSTed
#   login_page_url   page that renders the form (also where a CSRF cookie is minted)
#   username_field / password_field   parameter names in the login request
#   extra_fields     anything else the login needs (tenant id, CSRF placeholder...)
#   verify_url       a URL that only answers correctly when logged in  (REQUIRED:
#                    the harness verifies the session before the scan and refuses to
#                    label an anonymous scan "authenticated")
#   logged_in_regex / logged_out_regex   markers ZAP and the verifier match on
#   token_json_path  dotted path to the token in a JSON login response
#   session          cookie | bearer | header
#   logout_paths     paths every scanner must be told to avoid, or it logs itself out
#                    halfway through and the rest of the run is anonymous

version: 1

apps:
  shopfront:
    kind: json
    login_url: http://shopfront-web:3000/api/auth/login
    login_page_url: http://shopfront-web:3000/login
    username: customer@bench.local
    password: ${BENCH_SHOPFRONT_PASSWORD}
    username_field: email
    password_field: password
    verify_url: http://shopfront-web:3000/api/me
    logged_in_regex: '"customer_id"'
    logged_out_regex: '"error":"unauthenticated"'
    token_json_path: data.access_token
    session: bearer
    header_name: Authorization
    header_template: "Bearer {token}"
    logout_paths: ["/api/auth/logout"]

  admin:
    kind: form
    login_url: http://admin-web:8080/login
    login_page_url: http://admin-web:8080/login
    username: analyst
    password: ${BENCH_ADMIN_PASSWORD}
    username_field: username
    password_field: password
    verify_url: http://admin-web:8080/api/whoami
    logged_in_regex: '"authorities"'
    session: cookie
    logout_paths: ["/logout"]

  legacy:
    kind: form
    login_url: http://legacy-web/login.php
    login_page_url: http://legacy-web/login.php
    username: jdoe
    password: ${BENCH_LEGACY_PASSWORD}
    verify_url: http://legacy-web/account.php
    logged_in_regex: "Sign out"
    logged_out_regex: "Please log in"
    session: cookie
    logout_paths: ["/logout.php"]

  intranet:
    kind: form
    login_url: http://intranet-web:5000/login
    login_page_url: http://intranet-web:5000/login
    username: staff
    password: ${BENCH_INTRANET_PASSWORD}
    verify_url: http://intranet-web:5000/me
    logged_in_regex: "Logged in as"
    session: cookie
    logout_paths: ["/logout"]
